services:
  arxiv-mcp-server:
    build: .
    environment:
      TRANSPORT: http
      HOST: 0.0.0.0
      PORT: 8000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - "${HOME}/.arxiv-mcp-server/papers:/root/.arxiv-mcp-server/papers"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
